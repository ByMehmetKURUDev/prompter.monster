<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Prompter.Monster</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="wrap">
      <header>
        <img src="../icons/icon48.png" alt="" width="22" height="22" />
        <span class="brand">Prompter.Monster</span>
      </header>

      <div class="site-row" id="siteRow">
        <span class="dot" id="siteDot"></span>
        <span id="siteLabel">—</span>
      </div>

      <button type="button" id="pasteBtn" class="primary">
        <span id="btnIcon">📋</span>
        <span id="btnLabel">Panodakini Yapıştır</span>
      </button>

      <p class="status" id="status" hidden></p>

      <label class="toggle">
        <input type="checkbox" id="autoSubmit" />
        <span id="toggleLabel">Yapıştırdıktan sonra otomatik gönder</span>
      </label>
      <p class="hint" id="toggleHint">İncelemeden gönderir — dikkatli kullan.</p>

      <footer>
        <a href="https://prompter.monster/studio" target="_blank" rel="noopener noreferrer" id="footerLink">Prompter.Monster'da yeni prompt oluştur →</a>
      </footer>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
